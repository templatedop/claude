version: '3.8'

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  # Temporal server
  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy

  # PostgreSQL for Temporal and memory storage (with pgvector for embeddings)
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO initialization (create buckets)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/orchestrator --ignore-existing;
      mc mb myminio/documents --ignore-existing;
      mc mb myminio/embeddings --ignore-existing;
      exit 0;
      "

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # =============================================================================
  # Application Services
  # =============================================================================

  # Claude Orchestrator Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      # Claude API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Temporal
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=claude-orchestrator
      # Working directory
      - WORKING_DIR=/app/workspace
      # Memory
      - MEMORY_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=claude_orchestrator
      # Storage
      - FEATURE_STORAGE=true
      - STORAGE_TYPE=minio
      - S3_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=orchestrator
      - S3_PATH_STYLE=true
      - AWS_REGION=us-east-1
      # RAG
      - FEATURE_RAG=true
      - EMBEDDING_PROVIDER=openai
      - EMBEDDING_MODEL=text-embedding-3-small
      - EMBEDDING_API_KEY=${OPENAI_API_KEY:-}
      # Features
      - FEATURE_DOC_ANALYSIS=true
      - FEATURE_REQ_TRACKING=true
      - FEATURE_FRAMEWORK_LEARNING=true
      - FEATURE_CODE_REVIEW=true
      - FEATURE_PARALLEL_EXECUTION=true
    volumes:
      - ./workspace:/app/workspace
      - ./storage:/app/storage
      - ./config:/app/config:ro
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Claude Orchestrator API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TASK_QUEUE=claude-orchestrator
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # =============================================================================
  # Development/Debug Services
  # =============================================================================

  # CLI container for running commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      temporal:
        condition: service_healthy
    profiles:
      - cli

  # All-in-one container for development
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: all
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - WORKING_DIR=/app/workspace
      - FEATURE_STORAGE=true
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
    volumes:
      - ./workspace:/app/workspace
      - ./storage:/app/storage
    depends_on:
      temporal:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  default:
    name: claude-orchestrator
