# Default values for claude-orchestrator.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Common labels
commonLabels: {}
commonAnnotations: {}

# =============================================================================
# Worker Configuration
# =============================================================================
worker:
  enabled: true
  replicaCount: 1

  image:
    repository: claude-orchestrator-worker
    pullPolicy: IfNotPresent
    tag: ""  # Defaults to chart appVersion

  # Pod configuration
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Volume mounts
  persistence:
    workspace:
      enabled: true
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce
    storage:
      enabled: true
      size: 20Gi
      storageClass: ""
      accessMode: ReadWriteOnce

# =============================================================================
# API Configuration
# =============================================================================
api:
  enabled: true
  replicaCount: 2

  image:
    repository: claude-orchestrator-api
    pullPolicy: IfNotPresent
    tag: ""

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: claude-orchestrator.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Pod configuration
  podAnnotations: {}
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  # Node selection
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# Configuration
# =============================================================================
config:
  # Temporal connection
  temporal:
    address: "temporal-frontend:7233"
    namespace: "default"
    taskQueue: "claude-orchestrator"

  # Claude Configuration
  claude:
    # Provider: "api" (requires API key and credits) or "claude_code" (uses subscription)
    provider: "api"
    model: "claude-sonnet-4-20250514"
    maxTokens: 4096
    temperature: 0.7
    # Working directory for Claude Code operations (only used with claude_code provider)
    workingDir: "/app/workspace"
    # Allowed tools for Claude Code (only used with claude_code provider)
    allowedTools:
      - "Read"
      - "Write"
      - "Bash"
      - "Glob"
      - "Grep"

  # Memory configuration
  memory:
    type: "postgres"  # inmemory, postgres

  # Feature flags
  features:
    documentAnalysis: true
    requirementsTracking: true
    frameworkLearning: true
    codeReview: true
    parallelExecution: true
    storage: true
    rag: true

  # Storage configuration
  storage:
    type: "s3"  # local, s3, minio
    bucket: "orchestrator"
    # S3/MinIO settings pulled from minio subchart if enabled

  # RAG configuration
  rag:
    embedding:
      provider: "openai"
      model: "text-embedding-3-small"
      dimensions: 1536
    chunking:
      strategy: "sentence"
      chunkSize: 1000
      chunkOverlap: 200

# =============================================================================
# Secrets
# =============================================================================
secrets:
  # Create secrets or reference existing ones
  create: true

  # Anthropic API key (required)
  anthropicApiKey: ""
  anthropicApiKeyExistingSecret: ""
  anthropicApiKeySecretKey: "api-key"

  # OpenAI API key for embeddings (optional)
  openaiApiKey: ""
  openaiApiKeyExistingSecret: ""
  openaiApiKeySecretKey: "api-key"

  # PostgreSQL credentials (if using external)
  postgresPassword: ""
  postgresPasswordExistingSecret: ""
  postgresPasswordSecretKey: "password"

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Dependencies
# =============================================================================

# Temporal subchart
temporal:
  enabled: true
  server:
    replicaCount: 1
  cassandra:
    enabled: false
  mysql:
    enabled: false
  postgresql:
    enabled: false  # We use our own PostgreSQL
  prometheus:
    enabled: false
  grafana:
    enabled: false
  elasticsearch:
    enabled: false

# PostgreSQL subchart
postgresql:
  enabled: true
  auth:
    username: orchestrator
    password: ""  # Auto-generated if empty
    database: claude_orchestrator
  primary:
    persistence:
      enabled: true
      size: 10Gi

# MinIO subchart
minio:
  enabled: true
  mode: standalone
  replicas: 1
  persistence:
    enabled: true
    size: 50Gi
  rootUser: minioadmin
  rootPassword: ""  # Auto-generated if empty
  buckets:
    - name: orchestrator
      policy: none
    - name: documents
      policy: none
    - name: embeddings
      policy: none
  resources:
    requests:
      memory: 256Mi

# =============================================================================
# Logging
# =============================================================================
logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, console, text
  development: false
  addCaller: true
  addStacktrace: false
  sampling:
    enabled: false
    initial: 100
    thereafter: 100

# =============================================================================
# Metrics & Monitoring
# =============================================================================
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  namespace: "claude_orchestrator"
  enableGoMetrics: true
  enableProcessMetrics: true

  # Prometheus ServiceMonitor (requires Prometheus Operator)
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    # relabelings: []
    # metricRelabelings: []

  # Prometheus PodMonitor (alternative to ServiceMonitor)
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}

  # Prometheus Rules for alerting
  prometheusRules:
    enabled: false
    labels: {}
    rules: []
    # Example rules:
    # - alert: HighWorkflowFailureRate
    #   expr: rate(claude_orchestrator_workflows_failed_total[5m]) > 0.1
    #   for: 5m
    #   labels:
    #     severity: warning
    #   annotations:
    #     summary: High workflow failure rate
    #     description: "Workflow failure rate is above 10% for the last 5 minutes"

# =============================================================================
# Network Policies
# =============================================================================
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# =============================================================================
# Pod Disruption Budget
# =============================================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
