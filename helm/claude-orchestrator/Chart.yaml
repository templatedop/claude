apiVersion: v2
name: claude-orchestrator
description: A Helm chart for Claude Orchestrator - Go + Temporal AI agent orchestration
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - claude
  - temporal
  - orchestrator
  - ai
  - agents
home: https://github.com/anthropics/claude-orchestrator
sources:
  - https://github.com/anthropics/claude-orchestrator
maintainers:
  - name: Claude Orchestrator Team
dependencies:
  - name: temporal
    version: "0.35.0"
    repository: "https://go.temporal.io/helm-charts"
    condition: temporal.enabled
  - name: postgresql
    version: "13.2.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: minio
    version: "5.0.14"
    repository: "https://charts.min.io/"
    condition: minio.enabled
